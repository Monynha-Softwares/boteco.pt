name: Lighthouse CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
  merge_group:

permissions:
  contents: write # Required for 'temporary-public-storage' upload target
  actions: read

jobs:
  lighthouse:
    name: Run Lighthouse Audits
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project for Lighthouse
        run: pnpm build # Lighthouse CI needs a production build to audit

      - name: Run Lighthouse CI
        run: |
          pnpm lhci collect --config=.lighthouserc.json
          pnpm lhci assert --config=.lighthouserc.json