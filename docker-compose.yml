version: '3.8'

services:
  boteco-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_CLERK_FRONTEND_API_URL: ${VITE_CLERK_FRONTEND_API_URL:-}
        VITE_PROVISIONAL_REDIRECT: ${VITE_PROVISIONAL_REDIRECT:-false}
    container_name: boteco-pt
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
      - VITE_CLERK_FRONTEND_API_URL=${VITE_CLERK_FRONTEND_API_URL}
      - VITE_PROVISIONAL_REDIRECT=${VITE_PROVISIONAL_REDIRECT}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Resource limits (optional - adjust based on needs)
